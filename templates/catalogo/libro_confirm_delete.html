{% extends 'base.html' %}

{% block title %}Eliminar Libro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-panel text-center p-4">
            <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
            <h3 class="fw-bold mb-2">¿Eliminar Libro del Catálogo?</h3>
            <p class="text-muted mb-4">
                Estás a punto de eliminar el libro <strong>"{{ libro.titulo }}"</strong> (ISBN: {{ libro.isbn }}).
                Esta acción no se puede deshacer.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'libro_list' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="fa-solid fa-trash me-1"></i> Sí, Eliminar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
