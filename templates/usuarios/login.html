{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Biblioteca Institucional{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-book-bookmark text-primary display-4 mb-2"></i>
                <h3 class="fw-bold">Acceso al Sistema</h3>
                <p class="text-muted small">Ingresa tus credenciales institucionales de Bibliotecario o Lector</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label text-muted small fw-bold">Usuario / Código</label>
                    {{ form.username }}
                </div>

                <div class="mb-4">
                    <label for="{{ form.password.id_for_label }}" class="form-label text-muted small fw-bold">Contraseña</label>
                    {{ form.password }}
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
